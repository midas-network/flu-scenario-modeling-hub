data_inputs: "NHSN weekly influenza hospital admissions (all ages 2022-23 and 2023-24; by age group 2024-25 to 2026-27) from the hub target data; ACS state populations by age; hub vaccination coverage curves; synthetic contact matrices (Prem et al. 2021); absolute-humidity climatology."
citation: "Lemaitre JC, et al. flepiMoP: the evolution of a flexible infectious disease modeling pipeline during the COVID-19 pandemic. Epidemics. 2024;100753."
