methods: "Age-, vaccination- and state-stratified SEIR model in flepiMoP, fitted jointly over five seasons and 51 jurisdictions to NHSN hospital admissions by amortized neural posterior estimation, with an exact-likelihood update of the current season."

methods_long: "A deterministic SEIR model of influenza transmission for each of the 51 US jurisdictions, stratified by five age groups and three vaccination stages (unvaccinated, vaccinated, waned), with an Erlang-3 infectious period, age-assortative mixing from synthetic contact matrices, a humidity-derived climatological seasonal baseline with a fitted two-harmonic Fourier deviation, and negative-binomial observation of weekly hospital admissions by age. Transmissibility, seasonal shape, initial immunity by age, natural history, the age pattern of severity, reporting and seeding are shared through a hierarchy over the 2022-23 to 2026-27 seasons and over states. The hierarchy is fitted by amortized neural posterior estimation (masked autoregressive flows trained on prior simulations, checked by simulation-based calibration); the 2026-27 season terms and each state's 2026-27 terms are then re-estimated against the exact likelihood of the current season's weeks with the posterior as a penalty, holding the historical seasons fixed. Vaccination follows the hub's coverage curves; VE against infection is drawn from a Beta(5, 15) prior with the total VE against hospitalization fixed at 50%, and within-season waning is drawn from a distribution fitted to published VE declines. The model runs in flepiMoP (flepimop2 with op_system and op_engine)."

model_version: "2.0"
website_url: "https://www.flepimop.org/"

