methods: "Age-structured, multi-strain extended SLIR model with vaccination, calibrated to state-level NHSN hospitalizations by approximate Bayesian computation."
data_inputs: "NHSN weekly incident influenza hospital admissions (2026-27 season and 2023-24 to 2025-26 seasons); state and HHS-level influenza subtype proportions from CDC FluView and state health departments."
methods_long: "The Epydemix framework integrates demographic data with synthetic, high-resolution contact matrices that represent daily mixing across households, schools, workplaces, and community settings at a state-specific level. The infection dynamics are simulated using an age-structured SLIR-like model (5 age groups) extended to include asymptomatic transmission, hospitalization, and residual immunity from prior seasons. The model incorporates age-specific vaccination following the scenario coverage, school calendars that modulate the school contact matrix, and seasonal variation in transmissibility. Influenza strains are simulated and calibrated independently with approximate Bayesian computation (ABC-SMC)."
